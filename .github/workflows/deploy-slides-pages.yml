name: Deploy Slides to GitHub Pages

on:
  push:
    branches: ["main", "master"]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.event.pull_request.number) || 'pages' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: slides/package-lock.json

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Install dependencies
        working-directory: slides
        run: npm ci

      - name: Build landing deck
        working-directory: slides
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            npm run build -- --base "${{ steps.pages.outputs.base_path }}/pr-preview/pr-${{ github.event.pull_request.number }}/"
          else
            npm run build -- --base "/${{ github.event.repository.name }}/"
          fi

      - name: Build all decks
        working-directory: slides
        run: |
          for deck in decks/*.md; do
            slug="$(basename "$deck" .md)"
            npm run build:deck -- "$deck" --base "./"
            if [[ "$slug" == tmdb-discovery-* ]]; then
              npm run export:deck -- "$deck" --output "dist/${slug}.pdf"
            fi

            mkdir -p "dist/${slug}"
            rm -rf "dist/${slug}"/*
            cp -R decks/dist/. "dist/${slug}/"

            # Copy deck-local static assets (images, logos, etc.) referenced with relative paths.
            for item in decks/*; do
              name="$(basename "$item")"
              case "$name" in
                *.md|dist)
                  continue
                  ;;
              esac

              cp -R "$item" "dist/${slug}/"
            done
          done

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: slides/dist

  deploy:
    environment:
      name: ${{ github.event_name == 'pull_request' && format('github-pages-pr-{0}', github.event.pull_request.number) || 'github-pages' }}
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
        with:
          preview: ${{ github.event_name == 'pull_request' }}
